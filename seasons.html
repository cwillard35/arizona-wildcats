<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arizona Wildcats — Season Ratings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cardinal: #CC0033; --cardinal-dark: #990022; --cardinal-light: #ff1a4d;
    --navy: #003366; --navy-dark: #001a33; --navy-mid: #00244d;
    --gold: #FFC72C; --white: #ffffff; --off-white: #f5f5f5;
    --gray-mid: #aaaaaa; --gray-dark: #444444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Barlow', sans-serif; background: var(--navy-dark); color: var(--white); min-height: 100vh; }

  header { background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--cardinal-dark) 100%); border-bottom: 3px solid var(--cardinal); padding: 0 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
  .header-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 2rem; padding: 0.75rem 0; }
  .logo-mark { display: flex; align-items: center; flex-shrink: 0; }
  .logo-text { flex: 1; }
  .logo-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 3px; color: var(--white); line-height: 1; }
  .logo-text p { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; color: var(--gray-mid); margin-top: 2px; }
  nav { display: flex; gap: 0.25rem; }
  nav a { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); text-decoration: none; padding: 0.5rem 1rem; border-radius: 3px; transition: all 0.2s; }
  nav a:hover { color: var(--cardinal-light); background: rgba(204,0,51,0.2); }
  nav a.active { color: var(--gold); border-bottom: 2px solid var(--gold); border-radius: 3px 3px 0 0; }

  .admin-bar { background: rgba(255,199,44,0.1); border-bottom: 2px solid var(--gold); padding: 0.6rem 2rem; display: none; }
  .admin-bar-inner { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; }
  .admin-label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .admin-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 0.78rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 0.35rem 0.9rem; border-radius: 4px; cursor: pointer; border: none; background: var(--cardinal); color: var(--white); }
  .admin-btn:hover { background: var(--cardinal-dark); }

  .hero-strip { background: var(--cardinal); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 3rem; justify-content: center; flex-wrap: wrap; }
  .stat-chip { text-align: center; }
  .stat-chip .num { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 1; color: var(--white); }
  .stat-chip .label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.7); }

  main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

  .filters-bar { background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .filter-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .filter-group label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); }
  .filter-group select { background: var(--navy-dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; color: var(--white); font-family: 'Barlow Condensed', sans-serif; font-size: 0.9rem; padding: 0.4rem 0.75rem; outline: none; }

  /* SEASON CARD */
  .season-grid { display: flex; flex-direction: column; gap: 0.75rem; }
  .season-card { background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 1.25rem 1.5rem; display: grid; grid-template-columns: 90px 1fr auto; align-items: start; gap: 1.5rem; position: relative; overflow: hidden; transition: border-color 0.15s; }
  .season-card:hover { border-color: rgba(204,0,51,0.3); }
  .season-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .tier-5::before { background: var(--gold); }
  .tier-4::before { background: var(--cardinal); }
  .tier-3::before { background: #4488ff; }
  .tier-2::before { background: var(--gray-dark); }
  .tier-1::before { background: rgba(255,255,255,0.1); }
  .no-rating::before { background: transparent; }

  /* Year column */
  .season-year { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; color: var(--white); line-height: 1; }
  .season-year-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 2px; color: var(--gray-mid); text-transform: uppercase; margin-top: 2px; }

  /* Info column */
  .season-coach { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-mid); margin-bottom: 0.25rem; }
  .season-record { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; color: var(--white); }
  .season-conf-rec { font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; color: var(--gray-mid); margin-left: 0.5rem; }
  .season-meta { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 0.4rem; }
  .meta-chip { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; letter-spacing: 0.5px; color: var(--gray-mid); }
  .meta-chip span { color: var(--white); font-weight: 600; }
  .season-notes { font-size: 0.82rem; color: rgba(255,255,255,0.5); margin-top: 0.4rem; font-style: italic; }

  /* Tournament badge */
  .season-tournament { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; margin-top: 0.4rem; }
  .tourn-champion  { background: rgba(255,199,44,0.2); color: var(--gold); border: 1px solid rgba(255,199,44,0.4); }
  .tourn-runnerup  { background: rgba(180,150,0,0.2); color: #ddbb44; border: 1px solid rgba(180,150,0,0.3); }
  .tourn-final4    { background: rgba(204,0,51,0.2); color: #ff6688; border: 1px solid rgba(204,0,51,0.3); }
  .tourn-elite8    { background: rgba(68,136,255,0.2); color: #88aaff; border: 1px solid rgba(68,136,255,0.3); }
  .tourn-sweet16   { background: rgba(0,180,120,0.2); color: #44ddaa; border: 1px solid rgba(0,180,120,0.3); }
  .tourn-first2    { background: rgba(150,150,150,0.15); color: #aaa; border: 1px solid rgba(150,150,150,0.2); }
  .tourn-nit       { background: rgba(100,100,100,0.15); color: #888; border: 1px solid rgba(100,100,100,0.2); }
  .tourn-none      { color: rgba(255,255,255,0.2); font-style: italic; }

  /* Ratings column */
  .season-ratings { display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-end; min-width: 160px; }
  .rating-row { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: flex-end; }
  .rating-lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gray-mid); min-width: 65px; text-align: right; }
  .fbubbles { display: flex; gap: 3px; }
  .fb { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.12); flex-shrink: 0; }
  .fb.full { background: var(--cardinal); }
  .fb.full-gold { background: var(--gold); }
  .rating-num { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--white); min-width: 28px; }
  .rating-votes { font-family: 'Barlow Condensed', sans-serif; font-size: 0.65rem; color: var(--gray-mid); }
  .no-rating-msg { font-family: 'Barlow Condensed', sans-serif; font-size: 0.75rem; color: rgba(255,255,255,0.2); font-style: italic; }

  /* SLIDER VOTE WIDGET */
  .vote-slider-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; width: 100%; }
  .vote-slider-row { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-end; }
  .vote-slider {
    -webkit-appearance: none; appearance: none;
    width: 110px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.15); outline: none; cursor: pointer;
  }
  .vote-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--cardinal); cursor: pointer;
    border: 2px solid var(--white);
    box-shadow: 0 0 4px rgba(204,0,51,0.5);
    transition: background 0.15s;
  }
  .vote-slider::-webkit-slider-thumb:hover { background: var(--cardinal-light); }
  .vote-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--cardinal); cursor: pointer; border: 2px solid var(--white); }
  .vote-val { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--gold); min-width: 28px; text-align: right; }
  .vote-save-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; background: var(--cardinal); border: none; border-radius: 3px; color: var(--white); padding: 2px 8px; cursor: pointer; transition: background 0.2s; }
  .vote-save-btn:hover { background: var(--cardinal-dark); }
  .vote-saved { font-family: 'Barlow Condensed', sans-serif; font-size: 0.68rem; color: #44cc88; letter-spacing: 1px; }
  .vote-signin { font-family: 'Barlow Condensed', sans-serif; font-size: 0.72rem; color: var(--gray-mid); font-style: italic; cursor: pointer; }
  .vote-signin:hover { color: var(--cardinal-light); }

  .season-edit-btn { position: absolute; top: 0.75rem; right: 0.85rem; background: rgba(255,199,44,0.15); border: 1px solid rgba(255,199,44,0.3); border-radius: 3px; color: var(--gold); font-size: 0.65rem; font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; padding: 1px 6px; cursor: pointer; }
  .season-edit-btn:hover { background: rgba(255,199,44,0.3); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .modal { background: var(--navy-mid); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 2rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 3px; margin-bottom: 1.5rem; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .modal-field { display: flex; flex-direction: column; gap: 0.3rem; }
  .modal-field.full { grid-column: 1 / -1; }
  .modal-field label { font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray-mid); }
  .modal-field input, .modal-field select, .modal-field textarea { background: var(--navy-dark); border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; color: var(--white); font-family: 'Barlow', sans-serif; font-size: 0.9rem; padding: 0.5rem 0.75rem; outline: none; }
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus { border-color: var(--cardinal); }
  .modal-field textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .modal-btn { font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 0.6rem 1.5rem; border-radius: 4px; cursor: pointer; border: none; }
  .modal-btn-save { background: var(--cardinal); color: var(--white); }
  .modal-btn-cancel { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--gray-mid); }
  .modal-btn-delete { background: transparent; border: 1px solid rgba(204,0,51,0.4); color: var(--cardinal-light); margin-right: auto; }

  @media (max-width: 700px) {
    .season-card { grid-template-columns: 70px 1fr; }
    .season-ratings { grid-column: 1 / -1; align-items: flex-start; }
  }

  footer { text-align: center; padding: 2rem; margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.05); font-family: 'Barlow Condensed', sans-serif; font-size: 0.8rem; letter-spacing: 1px; color: rgba(255,255,255,0.25); }
  footer a { color: rgba(255,255,255,0.4); text-decoration: none; }
</style>

<script>
const SUPABASE_URL = 'https://lzzkqbiawsatzzcisypf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6emtxYmlhd3NhdHp6Y2lzeXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTE2MjgsImV4cCI6MjA5NTYyNzYyOH0.le5NdvH-dvHax6s2poggH2fTTZd7P8yMyExl2T-6GJ4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let allSeasons = [], communityVotes = {}, userVotes = {};
let currentUser = null, isAdmin = false;
let progressionData = {}; // year -> [{name, gs}]

async function loadProgression() {
  try {
    const res = await fetch('progression.json');
    const data = await res.json();
    // Group by year, sort by GS descending
    data.all_seasons.forEach(p => {
      if (!progressionData[p.year]) progressionData[p.year] = [];
      progressionData[p.year].push(p);
    });
  } catch(e) { console.warn('Could not load progression.json', e); }
}

function getStartingFive(year) {
  const players = progressionData[year];
  if (!players || !players.length) return null;
  const withGS = players.filter(p => p.totals?.gs > 0);
  if (!withGS.length) return null;
  withGS.sort((a, b) => (b.totals?.gs || 0) - (a.totals?.gs || 0));
  return withGS.slice(0, 5).map(p => p.name.replace(/\s*\(jc\)\s*/gi, '').trim().split(' ').pop()); // last names only
}

function bubbles(score, isGold) {
  if (score === null || score === undefined) return '';
  let html = '<div class="fbubbles">';
  for (let i = 1; i <= 5; i++) {
    const fill = Math.min(1, Math.max(0, score - (i - 1)));
    if (fill >= 1) {
      html += `<div class="fb ${isGold ? 'full-gold' : 'full'}"></div>`;
    } else if (fill > 0) {
      const pct = Math.round(fill * 100);
      const color = isGold ? 'var(--gold)' : 'var(--cardinal)';
      html += `<div class="fb" style="background:linear-gradient(90deg,${color} ${pct}%,rgba(255,255,255,0.12) ${pct}%)"></div>`;
    } else {
      html += '<div class="fb"></div>';
    }
  }
  return html + '</div>';
}

function tournBadge(result, tournament) {
  if (!result && tournament === 'None') return '<span class="season-tournament tourn-none">No Tournament</span>';
  if (!result) return '';
  const map = {
    'Champion':    ['tourn-champion', '🏆 National Champion'],
    'Runner Up':   ['tourn-runnerup', '🥈 Runner Up'],
    'Final Four':  ['tourn-final4',   'Final Four'],
    'Elite Eight': ['tourn-elite8',   'Elite Eight'],
    'Sweet 16':    ['tourn-sweet16',  'Sweet 16'],
    'Round of 32': ['tourn-first2',   'Round of 32'],
    'First Round': ['tourn-first2',   'First Round'],
    'NIT Champion':['tourn-sweet16',  'NIT Champion'],
    'NIT':         ['tourn-nit',      'NIT'],
  };
  const [cls, label] = map[result] || ['tourn-none', result];
  return `<span class="season-tournament ${cls}">${label}</span>`;
}

function tierClass(rating) {
  if (!rating) return 'no-rating';
  if (rating >= 4.5) return 'tier-5';
  if (rating >= 3.5) return 'tier-4';
  if (rating >= 2.5) return 'tier-3';
  if (rating >= 1.5) return 'tier-2';
  return 'tier-1';
}

function sliderWidget(seasonId, userScore) {
  if (!currentUser) return `<span class="vote-signin" onclick="alert('Sign in on the Players page to vote')">Sign in to rate</span>`;
  const val = userScore ? userScore.toFixed(2) : '3.00';
  return `<div class="vote-slider-wrap">
    <div class="vote-slider-row">
      <input type="range" class="vote-slider" data-sid="${seasonId}"
        min="1" max="5" step="0.25" value="${userScore || 3}">
      <span class="vote-val" id="vval-${seasonId}">${userScore ? userScore.toFixed(2) : '—'}</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end;">
      <button class="vote-save-btn" data-sid="${seasonId}">Save</button>
      ${userScore ? `<span class="vote-saved" id="vsaved-${seasonId}">✓ voted</span>` : `<span class="vote-saved" id="vsaved-${seasonId}" style="display:none">✓ saved</span>`}
    </div>
  </div>`;
}

function applyFilters() {
  const coach      = document.getElementById('filterCoach').value;
  const tournament = document.getElementById('filterTournament').value;
  const [col, dir] = document.getElementById('sortSelect').value.split('-');

  let filtered = [...allSeasons];
  if (coach) filtered = filtered.filter(s => s.coach === coach);
  if (tournament) {
    const order = ['Champion','Runner Up','Final Four','Elite Eight','Sweet 16','Round of 32','First Round'];
    const idx = order.indexOf(tournament);
    if (tournament === 'NCAA') filtered = filtered.filter(s => s.tournament === 'NCAA');
    else if (tournament === 'None') filtered = filtered.filter(s => !s.tournament || s.tournament === 'None');
    else filtered = filtered.filter(s => order.indexOf(s.tournament_result) <= idx && order.indexOf(s.tournament_result) >= 0);
  }

  filtered.sort((a, b) => {
    let av = col === 'year'      ? a.year :
             col === 'rating'    ? (a.rating || 0) :
             col === 'community' ? (communityVotes[a.id]?.avg || 0) :
             col === 'wins'      ? (a.wins || 0) : 0;
    let bv = col === 'year'      ? b.year :
             col === 'rating'    ? (b.rating || 0) :
             col === 'community' ? (communityVotes[b.id]?.avg || 0) :
             col === 'wins'      ? (b.wins || 0) : 0;
    return dir === 'desc' ? bv - av : av - bv;
  });

  render(filtered);
}

function render(seasons) {
  const grid = document.getElementById('seasonGrid');
  if (!seasons || seasons.length === 0) {
    grid.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--gray-mid);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;">No seasons found.</div>`;
    return;
  }

  grid.innerHTML = seasons.map(s => {
    const cv      = communityVotes[s.id];
    const uv      = userVotes[s.id];
    const tier    = tierClass(s.rating);
    const editBtn = isAdmin ? `<button class="season-edit-btn" onclick="openModal('${s.id}')">edit</button>` : '';
    const record  = (s.wins !== null && s.losses !== null) ? `${s.wins}–${s.losses}` : '';
    const yr1     = s.year - 1, yr2 = String(s.year).slice(2);

    // AP rankings and seed chips
    const chips = [];
    if (s.ncaa_seed)  chips.push(`<span class="meta-chip">#<span>${s.ncaa_seed}</span> seed</span>`);
    if (s.ap_pre)     chips.push(`<span class="meta-chip">AP Pre: <span>${s.ap_pre}</span></span>`);
    if (s.ap_high)    chips.push(`<span class="meta-chip">AP High: <span>${s.ap_high}</span></span>`);
    if (s.ap_final)   chips.push(`<span class="meta-chip">AP Final: <span>${s.ap_final}</span></span>`);
    if (s.pts_per_game) chips.push(`<span class="meta-chip">PPG: <span>${Number(s.pts_per_game).toFixed(1)}</span></span>`);
    if (s.pts_allowed)  chips.push(`<span class="meta-chip">Opp: <span>${Number(s.pts_allowed).toFixed(1)}</span></span>`);

    return `<div class="season-card ${tier}">
      ${editBtn}
      <div>
        <div class="season-year">${s.year}</div>
        <div class="season-year-sub">${yr1}–${yr2}</div>
      </div>
      <div>
        <div class="season-coach">${s.coach || ''} Era${s.conf ? ' · ' + s.conf : ''}</div>
        <div>
          ${record ? `<span class="season-record">${record}</span>` : ''}
          ${s.conf_record ? `<span class="season-conf-rec">${s.conf_record}${s.conf_finish ? ' · ' + s.conf_finish : ''}</span>` : ''}
        </div>
        ${tournBadge(s.tournament_result, s.tournament)}
        ${chips.length ? `<div class="season-meta">${chips.join('')}</div>` : ''}
        ${s.notes ? `<div class="season-notes">${s.notes}</div>` : ''}
        ${(() => { const five = getStartingFive(s.year); return five ? `<div class="season-notes" style="margin-top:0.4rem;color:rgba(255,255,255,0.4);">Starting 5: ${five.join(', ')}</div>` : ''; })()}
      </div>
      <div class="season-ratings">
        ${s.rating !== null && s.rating !== undefined ? `
        <div class="rating-row">
          <span class="rating-lbl">Editor</span>
          ${bubbles(s.rating, s.rating >= 4.5)}
          <span class="rating-num">${Number(s.rating).toFixed(2)}</span>
        </div>` : ''}
        ${cv ? `
        <div class="rating-row">
          <span class="rating-lbl">Community</span>
          ${bubbles(cv.avg, cv.avg >= 4.5)}
          <span class="rating-num">${cv.avg.toFixed(2)}</span>
          <span class="rating-votes">(${cv.count})</span>
        </div>` : `<div class="rating-row"><span class="rating-lbl">Community</span><span class="no-rating-msg">no votes</span></div>`}
        <div class="rating-row" style="flex-direction:column;align-items:flex-end;gap:4px;">
          <span class="rating-lbl" style="align-self:flex-end;">Your Vote</span>
          ${sliderWidget(s.id, uv)}
        </div>
      </div>
    </div>`;
  }).join('');

  // Bind slider events
  grid.querySelectorAll('.vote-slider').forEach(slider => {
    const sid    = slider.dataset.sid;
    const valEl  = document.getElementById(`vval-${sid}`);
    slider.addEventListener('input', () => {
      const raw = parseFloat(slider.value);
      const snapped = Math.round(raw * 4) / 4;
      slider.value = snapped;
      valEl.textContent = snapped.toFixed(2);
    });
  });

  grid.querySelectorAll('.vote-save-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const sid    = btn.dataset.sid;
      const slider = grid.querySelector(`.vote-slider[data-sid="${sid}"]`);
      const score = Math.round(parseFloat(slider.value) * 4) / 4; // snap to nearest 0.25
      btn.textContent = '...';
      await submitVote(sid, score);
      btn.textContent = 'Save';
      const savedEl = document.getElementById(`vsaved-${sid}`);
      if (savedEl) { savedEl.style.display = 'inline'; }
    });
  });
}

async function loadVotes() {
  const { data } = await db.from('season_votes').select('season_id, score');
  if (!data) return;
  const agg = {};
  data.forEach(v => {
    if (!agg[v.season_id]) agg[v.season_id] = { total: 0, count: 0 };
    agg[v.season_id].total += parseFloat(v.score);
    agg[v.season_id].count += 1;
  });
  communityVotes = {};
  for (const [sid, val] of Object.entries(agg)) {
    communityVotes[sid] = { avg: val.total / val.count, count: val.count };
  }
}

async function loadUserVotes() {
  if (!currentUser) return;
  const { data } = await db.from('season_votes').select('season_id, score').eq('user_id', currentUser.id);
  if (!data) return;
  userVotes = {};
  data.forEach(v => { userVotes[v.season_id] = parseFloat(v.score); });
}

async function submitVote(seasonId, score) {
  if (!currentUser) return;

  const result = await db.from('season_votes')
    .upsert(
      { season_id: seasonId, user_id: currentUser.id, score, updated_at: new Date().toISOString() },
      { onConflict: 'season_id,user_id' }
    );

  if (result.error) {
    console.error('Vote error:', result.error);
    alert(`Vote failed: ${result.error.message}`);
    return;
  }

  // Reload everything fresh from server
  await Promise.all([loadVotes(), loadUserVotes()]);
  applyFilters();
}


function openModal(seasonId) {
  const s = seasonId ? allSeasons.find(x => x.id === seasonId) : null;
  document.getElementById('modalTitle').textContent = s ? 'Edit Season' : 'Add Season';
  document.getElementById('modalSeasonId').value    = s?.id || '';
  document.getElementById('deleteSeasonBtn').style.display = s ? 'block' : 'none';
  document.getElementById('fYear').value             = s?.year            || '';
  document.getElementById('fCoach').value            = s?.coach           || '';
  document.getElementById('fWins').value             = s?.wins            ?? '';
  document.getElementById('fLosses').value           = s?.losses          ?? '';
  document.getElementById('fConfRecord').value       = s?.conf_record     || '';
  document.getElementById('fConfFinish').value       = s?.conf_finish     || '';
  document.getElementById('fTournament').value       = s?.tournament      || '';
  document.getElementById('fTournamentResult').value = s?.tournament_result || '';
  document.getElementById('fRating').value           = s?.rating          ?? '';
  document.getElementById('fSeed').value             = s?.ncaa_seed       ?? '';
  document.getElementById('fNotes').value            = s?.notes           || '';
  document.getElementById('seasonModal').style.display = 'flex';
}

function closeModal() { document.getElementById('seasonModal').style.display = 'none'; }

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (session) {
    currentUser = session.user;
    if (currentUser.email === 'caseywillard@yahoo.com') {
      isAdmin = true;
      document.getElementById('adminBar').style.display = 'block';
    }
    await loadUserVotes();
  }

  const [seasonsResult] = await Promise.all([
    db.from('seasons').select('*').order('year', { ascending: false }),
    loadVotes(),
    loadProgression(),
  ]);

  allSeasons = seasonsResult.data || [];

  document.getElementById('statSeasons').textContent = allSeasons.length;
  const totalWins = allSeasons.reduce((a, s) => a + (s.wins || 0), 0);
  document.getElementById('statWins').textContent = totalWins || '—';
  const rated = allSeasons.filter(s => s.rating !== null && s.rating !== undefined);
  if (rated.length) {
    const avg = rated.reduce((a, s) => a + parseFloat(s.rating), 0) / rated.length;
    document.getElementById('statAvgRating').textContent = avg.toFixed(2);
  }

  applyFilters();

  document.getElementById('filterCoach').addEventListener('change', applyFilters);
  document.getElementById('filterTournament').addEventListener('change', applyFilters);
  document.getElementById('sortSelect').addEventListener('change', applyFilters);

  document.getElementById('addSeasonBtn')?.addEventListener('click', () => openModal(null));
  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  document.getElementById('seasonModal').addEventListener('click', e => {
    if (e.target === document.getElementById('seasonModal')) closeModal();
  });

  document.getElementById('modalSaveBtn').addEventListener('click', async () => {
    const id   = document.getElementById('modalSeasonId').value;
    const data = {
      year:              parseInt(document.getElementById('fYear').value) || null,
      coach:             document.getElementById('fCoach').value || null,
      wins:              parseInt(document.getElementById('fWins').value) || null,
      losses:            parseInt(document.getElementById('fLosses').value) || null,
      conf_record:       document.getElementById('fConfRecord').value || null,
      conf_finish:       document.getElementById('fConfFinish').value || null,
      tournament:        document.getElementById('fTournament').value || null,
      tournament_result: document.getElementById('fTournamentResult').value || null,
      rating:            parseFloat(document.getElementById('fRating').value) || null,
      ncaa_seed:         parseInt(document.getElementById('fSeed').value) || null,
      notes:             document.getElementById('fNotes').value || null,
    };
    if (!data.year) { alert('Year is required'); return; }
    const btn = document.getElementById('modalSaveBtn');
    btn.textContent = 'Saving...'; btn.disabled = true;
    let result;
    if (id) {
      result = await db.from('seasons').update(data).eq('id', id).select().single();
    } else {
      result = await db.from('seasons').insert(data).select().single();
    }
    btn.textContent = 'Save Season'; btn.disabled = false;
    if (result.error) { alert('Error: ' + result.error.message); return; }
    if (id) {
      const idx = allSeasons.findIndex(s => s.id === id);
      if (idx >= 0) allSeasons[idx] = result.data;
    } else {
      allSeasons.unshift(result.data);
    }
    closeModal();
    applyFilters();
    document.getElementById('statSeasons').textContent = allSeasons.length;
  });

  document.getElementById('deleteSeasonBtn').addEventListener('click', async () => {
    const id = document.getElementById('modalSeasonId').value;
    if (!confirm('Delete this season?')) return;
    const { error } = await db.from('seasons').delete().eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    allSeasons = allSeasons.filter(s => s.id !== id);
    closeModal(); applyFilters();
  });
}

init();
</script>
